# Fly.io configuration for ShroudX (https://shroudx.us)
# If the global Fly app name "shroudx" is already claimed, change `app` below
# (e.g. "shroudx-web") — your custom domain shroudx.us is unaffected.

app = "shroudx"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  SPHX_MODE = "auto"
  SPHX_CACHE_DIR = "/app/cache"
  SPHX_RESULTS_DIR = "/app/results"
  SPHX_REQUEST_TIMEOUT = "30.0"
  SPHX_IRSA_CONCURRENCY = "2"
  SPHX_CANONICAL_HOST = "shroudx.us"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Set min_machines_running = 1 (and auto_stop_machines = "off") to eliminate cold starts.
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
